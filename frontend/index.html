<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGENT HUB</title>

  <!-- Pixel font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <!-- Code highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- XSS sanitiser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <!-- CRT scanline overlay -->
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="hub-logo">
        <canvas id="logo-canvas" width="64" height="64"></canvas>
        <div class="logo-title">AGENT<br><span class="logo-hub">HUB</span></div>
      </div>

      <nav class="agent-list" id="agent-list" aria-label="Agents">
        <!-- Populated by JS -->
      </nav>

      <footer class="sidebar-footer">
        <span class="dim">v1.0.0 // ONLINE</span>
      </footer>
    </aside>

    <!-- ── Main content ── -->
    <main class="main-content" id="main-content">

      <!-- Welcome screen -->
      <div class="welcome-screen" id="welcome-screen">
        <canvas id="welcome-canvas" width="160" height="160"></canvas>
        <h1 class="welcome-title">AGENT HUB</h1>
        <p class="welcome-sub">SELECT AN AGENT TO BEGIN<br><span class="dim">7 SPECIALISTS ONLINE</span></p>
      </div>

      <!-- Chat area (hidden until agent selected) -->
      <div class="chat-area" id="chat-area" style="display:none">

        <header class="agent-header">
          <canvas id="header-anim"></canvas>
          <div class="agent-header-info">
            <div class="agent-header-name" id="header-name"></div>
            <div class="agent-header-desc" id="header-desc"></div>
          </div>
          <div class="header-actions">
            <div class="conn-indicator" id="conn-indicator" title="Connection status">
              <span class="conn-dot"></span>
              <span class="conn-label" id="conn-label">CONNECTING</span>
            </div>
            <button class="pixel-btn clear-btn" onclick="clearChat()" title="Clear conversation">CLR</button>
          </div>
        </header>

        <div class="messages-container" id="messages" role="log" aria-live="polite"></div>

        <div class="input-area">
          <textarea
            id="message-input"
            placeholder="> ENTER MESSAGE... (SHIFT+ENTER for newline)"
            onkeydown="handleKeyDown(event)"
            rows="2"
            aria-label="Message input"
          ></textarea>
          <button class="pixel-btn send-btn" id="send-btn" onclick="sendMessage()">SEND</button>
        </div>

      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
